name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build or update, for example v0.0.1'
        required: true
        default: 'v0.0.1'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Signing runs only when the repo has the Apple secrets, so a release
      # still ships without them. See the README for the secret names.
      CAN_SIGN: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_TEAM_NAME != '' && secrets.APPLE_TEAM_ID != '' }}
      CAN_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v(.*)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}$ ]]; then
              echo "Manual release tag must look like v0.0.1" >&2
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$cargo_version" != "${{ steps.get_version.outputs.version }}" ]]; then
            echo "Cargo.toml has version $cargo_version, but the tag is ${{ steps.get_version.outputs.tag }}" >&2
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: |
          cargo build --release --locked
          ls -lh target/release/update-all
          target/release/update-all --version

      - name: Import Developer ID certificate
        if: env.CAN_SIGN == 'true'
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign

          # Each existing keychain has to be its own argument, so this line splits the list on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: Code sign binary
        if: env.CAN_SIGN == 'true'
        run: |
          SIGN_IDENTITY="Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }} (${{ secrets.APPLE_TEAM_ID }})"

          codesign --force --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" \
            target/release/update-all

          codesign --verify --strict --verbose=2 target/release/update-all
          codesign -dvv target/release/update-all

      - name: Create zip
        run: |
          name="update-all-${{ steps.get_version.outputs.version }}-macos-arm64"
          mkdir -p "dist/$name"
          cp target/release/update-all README.md LICENSE config.toml "dist/$name/"
          ditto -c -k --keepParent "dist/$name" "$name.zip"
          echo "zip=$name.zip" >> "$GITHUB_ENV"
          ls -lh "$name.zip"

      - name: Notarize zip
        if: env.CAN_SIGN == 'true' && env.CAN_NOTARIZE == 'true'
        run: |
          # Apple can't staple a ticket to a bare binary, so macOS checks the
          # notarization online the first time the binary runs.
          xcrun notarytool submit "$zip" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait

      - name: Create checksums
        run: |
          shasum -a 256 "$zip" > "$zip.sha256"
          cat "$zip.sha256"

      - name: Write release notes
        run: |
          # The template has one block for notarized builds and one for
          # unsigned builds. This keeps the block that fits this build.
          if [[ "$CAN_SIGN" == "true" && "$CAN_NOTARIZE" == "true" ]]; then
            drop=unsigned
          else
            drop=notarized
          fi
          awk -v drop="$drop" '
            $0 == "<!-- " drop " -->" { skip = 1; next }
            $0 == "<!-- /" drop " -->" { skip = 0; next }
            /^<!-- \/?(notarized|unsigned) -->$/ { next }
            !skip
          ' .github/release-notes.md \
            | sed -e "s/@VERSION@/${{ steps.get_version.outputs.version }}/g" -e "s/@ZIP@/$zip/g" \
            > release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          RELEASE_TITLE: update-all ${{ steps.get_version.outputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_NOTES_FILE: release-notes.md
        run: |
          assets=("$zip" "$zip.sha256")
          release_args=(--title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES_FILE" --latest)

          if [[ -n "${RELEASE_TARGET:-}" ]]; then
            release_args+=(--target "$RELEASE_TARGET")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${release_args[@]}"
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" "${release_args[@]}" "${assets[@]}"
          fi

      - name: Cleanup keychain
        if: always() && env.CAN_SIGN == 'true'
        run: |
          security delete-keychain build.keychain
