[package]
name = "update-all"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Updates everything on a Mac from one command."
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
block2 = "0.6"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ed25519-dalek = "2"
indicatif = "0.18"
jiff = "0.2"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
plist = "1"
ratatui = "0.30"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
